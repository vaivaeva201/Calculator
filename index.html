<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator">
            <input type="text" id="display" class="calc_screen" value="0" readonly>
            <input type="text" id="error" class="error_screen" value="" readonly>

            <div class="extra_functions">
                <button class="functions">x!</button>
                <button class="functions">+/-</button>
                <button class="functions">(</button>
                <button class="functions">)</button>
                <button class="functions">x²</button>
                <button class="functions">xⁿ</button>
                <button class="functions"><sup>2</sup>&radic;x</button>
                <button class="functions"><sup>n</sup>&radic;x</button>
            </div>

            <div class="main">
                <button class="pag_funk AC">AC</button>
                <button class="pag_funk">÷</button>
                <button class="pag_funk">×</button>

                <button class="skaicius">7</button>
                <button class="skaicius">8</button>
                <button class="skaicius">9</button>
                <button class="pag_funk">-</button>

                <button class="skaicius">4</button>
                <button class="skaicius">5</button>
                <button class="skaicius">6</button>
                <button class="pag_funk">+</button>

                <button class="skaicius">1</button>
                <button class="skaicius">2</button>
                <button class="skaicius">3</button>

                <button class="pag_funk equal-btn">=</button>

                <button class="skaicius c">C</button>
                <button class="skaicius zero-btn">0</button>
                <button class="skaicius dot">.</button>
            </div>
         </div>
    </body>
</html>
